# Build Docker image and push to Docker Hub
# WHY: Docker Hub allows anonymous pulls for public images, easier for Render
#
# SETUP REQUIRED:
# 1. Create Docker Hub account at hub.docker.com if you don't have one
# 2. Create repository "prometheus-toolkit" at hub.docker.com/repositories
# 3. Add GitHub secrets:
#    - DOCKERHUB_USERNAME: Your Docker Hub username
#    - DOCKERHUB_TOKEN: Access token from Docker Hub (Settings > Security > New Access Token)
#
name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  # Change this to match your Docker Hub username/repo
  DOCKERHUB_REPO: watchersociety/prometheus-toolkit

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
